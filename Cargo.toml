[workspace]
resolver = "3"
members = ["crates/disknido-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/emmanuelquintana/disknido"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# Hashing and zlib are hot loops; keep them fast in debug builds too so tests are realistic.
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
