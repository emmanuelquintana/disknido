name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo test -p disknido-core
      - run: pnpm test
      - run: pnpm tauri build

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory dist-release | Out-Null
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item $_ "dist-release/DiskNido-$v-windows-x64-setup.exe" }
          Get-ChildItem target/release/bundle/msi/*.msi | ForEach-Object {
            $lang = if ($_.Name -match '_(\w\w-\w\w)\.msi$') { $Matches[1] } else { "msi" }
            Copy-Item $_ "dist-release/DiskNido-$v-windows-x64-$lang.msi"
          }
          Get-ChildItem dist-release | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist-release/SHA256SUMS.txt
          Get-Content dist-release/SHA256SUMS.txt

      - name: Draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist-release/* --draft --title "DiskNido ${{ github.ref_name }}" --notes-file .github/release-notes.md
